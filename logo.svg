<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" role="img" aria-label="Devriston">
  <defs>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: 44x44 pill -->
  <rect x="0" y="2" width="44" height="44" rx="10" fill="#0f172a"/>

  <!-- Geometric V — two precise converging bars -->
  <!-- Left bar: top-left down to center-bottom -->
  <rect x="9" y="10" width="5" height="26" rx="2.5"
        transform="rotate(-18 11.5 23)"
        fill="url(#vgrad)"/>
  <!-- Right bar: top-right down to center-bottom -->
  <rect x="30" y="10" width="5" height="26" rx="2.5"
        transform="rotate(18 32.5 23)"
        fill="url(#vgrad)"/>

  <!-- Node dot at apex (bottom center of V) -->
  <circle cx="22" cy="36" r="2.5" fill="#22c55e"/>
  <!-- Subtle circuit tick top-left -->
  <line x1="9" y1="14" x2="6" y2="14" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <!-- Subtle circuit tick top-right -->
  <line x1="35" y1="14" x2="38" y2="14" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>

  <!-- Wordmark -->
  <text x="56" y="32"
        font-family="'Plus Jakarta Sans','Poppins',sans-serif"
        font-weight="800"
        font-size="21"
        fill="#0f172a"
        letter-spacing="-0.5">Devri<tspan fill="#2563eb">ston</tspan></text>
</svg>
