<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Devriston icon">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#0f172a"/>
  <!-- V left bar -->
  <rect x="8" y="9" width="5.5" height="28" rx="2.75"
        transform="rotate(-18 10.75 23)"
        fill="url(#ig)"/>
  <!-- V right bar -->
  <rect x="34.5" y="9" width="5.5" height="28" rx="2.75"
        transform="rotate(18 37.25 23)"
        fill="url(#ig)"/>
  <!-- Apex node -->
  <circle cx="24" cy="38" r="3" fill="#22c55e"/>
  <!-- Circuit ticks -->
  <line x1="8" y1="13" x2="4" y2="13" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
  <line x1="40" y1="13" x2="44" y2="13" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
</svg>
