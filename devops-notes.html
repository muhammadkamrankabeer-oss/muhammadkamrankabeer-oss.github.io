  <style>
    /* Global System Variables */
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111a2e;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --border-color: #1e293b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Modern Utilities */
    .flex-row-wrap-gap {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      margin-top: 28px;
    }

    /* Filter Navigation */
    .nav-filters {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }

    /* Category Semantic Headers */
    .cat-hdr {
      width: 100%;
      margin: 2rem 0 1rem 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    h2.cat-hdr-title {
      font-size: 1.75rem;
      color: var(--text-main);
      text-transform: capitalize;
    }

    /* Cards Architecture */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .n-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .n-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .n-card-title {
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
      color: #fff;
    }

    .n-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .n-tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
    }

    .n-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-blue);
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      font-weight: 700;
    }

    .n-desc, .n-why, .n-example, .n-tip, .n-practice {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    /* Enhanced Code Snippet Containers */
    .n-code-wrapper {
      position: relative;
      margin: 0.75rem 0;
    }

    .n-code {
      background: #070b12;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      color: #a9b7c6;
      border: 1px solid rgba(255,255,255,0.05);
      display: block;
      white-space: pre;
    }

    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 2px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .copy-btn:hover {
      background: var(--accent-blue);
      color: #fff;
    }

    /* Animations */
    .fade-up {
      animation: fadeUp 0.4s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
